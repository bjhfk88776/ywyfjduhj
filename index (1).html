function H(a,b){let x=(a^Math.imul(b|0,0x9e3779b1))>>>0;x=Math.imul(x^x>>>15,0x85ebca6b);x=Math.imul(x^x>>>13,0xc2b2ae35);return((x^x>>>16)>>>0)/4294967296}

function pr(i,ts){const d=Math.floor(ts/86400),k=i.s+i.m+d;if(!CA[k]){const sd=sh(i.s+i.m),v=VOL[i.c],a=new Float64Array(86401);let x=0;
 for(let j=1;j<=86400;j++){const g=H(sd,d*86400+j)+H(sd+1,d*86400+j)+H(sd+2,d*86400+j)-1.5;x+=v*2*g;a[j]=i.p*Math.exp(x)}CA[k]=a}return CA[k][ts-d*86400]}
const now=()=>Math.floor(Date.now()/1000);
function candles(i,hz,n=now()){const st=STEP[hz],end=Math.floor(n/st)*st,o=[];for(let j=119;j>=0;j--){const s=end-j*st,e=Math.min(s+st,n);let hi=-1e18,lo=1e18;for(let q=s;q<=e;q++){const p=pr(i,q);hi=Math.max(hi,p);lo=Math.min(lo,p)}o.push({s,e,o:pr(i,s),c:pr(i,e),h:hi,l:lo})}return o}

function ema(a,p){const k=2/(p+1),o=[a[0]];for(let i=1;i<a.length;i++)o.push(a[i]*k+o[i-1]*(1-k));return o}
function rsi(c,p=14){let g=0,l=0;for(let i=1;i<=p;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}g/=p;l/=p;for(let i=p+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(p-1)+Math.max(d,0))/p;l=(l*(p-1)+Math.max(-d,0))/p}return l===0?100:100-100/(1+g/l)}
function atr(cs,p=14){let a=0;for(let i=1;i<=p;i++)a+=tr(cs,i);a/=p;for(let i=p+1;i<cs.length;i++)a=(a*(p-1)+tr(cs,i))/p;return a}
const tr=(cs,i)=>Math.max(cs[i].h-cs[i].l,Math.abs(cs[i].h-cs[i-1].c),Math.abs(cs[i].l-cs[i-1].c));
function macd(c){const a=ema(c,12),b=ema(c,26),l=a.map((x,i)=>x-b[i]),s=ema(l,9),h=l.map((x,i)=>x-s[i]);return{h:h[h.length-1],hp:h[h.length-2]}}
function levels(cs){const r=[],s=[];for(let i=2;i<cs.length-2;i++){const x=cs[i];if([-2,-1,1,2].every(d=>x.h>cs[i+d].h))r.push(x.h);if([-2,-1,1,2].every(d=>x.l<cs[i+d].l))s.push(x.l)}return{r,s}}
/* ---- Market Analysis Engine ---- */
function analyze(cs,hz,n){const R=[],out={dec:'UNAVAILABLE',bull:0,bear:0,reasons:R,t:n,exp:n+hz};
 if(!cs||cs.length<CFG.minCandles){R.push(['d0']);return out}
 if(n-cs[cs.length-1].e>CFG.stale*STEP[hz]){R.push(['d1']);return out}
 const P=PAR[hz],c=cs.map(x=>x.c),px=c[c.length-1],e9=ema(c,P.e[0]),e21=ema(c,P.e[1]),e50=ema(c,P.e[2]),L=c.length-1,rs=rsi(c,P.r),m=macd(c),at=atr(cs),W=CFG.w,Z=CFG.hz[hz];
 let b=0,s=0;
 if(e9[L]>e21[L]){b+=W.ema*Z.ema;R.push(['e1'])}else{s+=W.ema*Z.ema;R.push(['e2'])}
 if(e21[L]>e50[L]){b+=W.ema2*Z.ema;R.push(['f1'])}else{s+=W.ema2*Z.ema;R.push(['f2'])}
 const rv=rs.toFixed(0);
 if(rs>75){s+=W.rsi;R.push(['r3',rv])}else if(rs<25){b+=W.rsi;R.push(['r4',rv])}else if(rs>55){b+=W.rsi;R.push(['r1',rv])}else if(rs<45){s+=W.rsi;R.push(['r2',rv])}
 if(m.h>0&&m.h>m.hp){b+=W.macd;R.push(['m1'])}else if(m.h<0&&m.h<m.hp){s+=W.macd;R.push(['m2'])}
 const mo=px-c[L-P.m];if(Math.abs(mo)>at*.3){if(mo>0){b+=W.mom*Z.mom;R.push(['p1'])}else{s+=W.mom*Z.mom;R.push(['p2'])}}
 const lv=levels(cs.slice(-60)),sup=Math.max(...lv.s.filter(x=>x<px),-1),res=Math.min(...lv.r.filter(x=>x>px),1e18);
 if(px-sup<at*.5&&sup>0){b+=W.sr;R.push(['s1'])}else if(res-px<at*.5&&res<1e17){s+=W.sr;R.push(['s2'])}
 Object.assign(out,{bull:+b.toFixed(1),bear:+s.toFixed(1),price:px,rsi:rs,atrp:at/px,e9:e9[L],e21:e21[L],e50:e50[L],mh:m.h,sup:sup>0?sup:null,rs:res<1e17?res:null});
 const df=b-s;let dec=df>0?'CALL':df<0?'PUT':(mo>=0?'CALL':'PUT');out.edge=Math.abs(df);
 if(at/px<CFG.minVol){R.push(['v0'])}else if(Math.max(b,s)<CFG.thr||Math.abs(df)<CFG.minDiff){R.push(['w0'])}
 out.dec=dec;return out}
/* ---- history ---- */
let HIS=ls.g('his',[]).filter(h=>INS.some(x=>x.s===h.sym&&x.m===h.m));
function resolve(){let ch=false;const n=now();HIS.forEach(h=>{if(h.res||n<h.exp)return;const i=INS.find(x=>x.s===h.sym&&x.m===h.m);if(!i){h.res='na';ch=true;return}h.p1=pr(i,h.exp);h.res=h.p1===h.p0?'na':((h.dec==='CALL')===(h.p1>h.p0)?'ok':'bad');ch=true});if(ch){ls.s('his',HIS);if(S.v==='inst')hist();if(S.v==='home')stats()}}
const left=i=>Infinity;
/* ---- UI ---- */
const $=s=>document.querySelector(s),fmt=p=>p>=100?p.toFixed(2):p>=1?p.toFixed(4):p>=.01?p.toFixed(5):p.toFixed(8),tm=ts=>new Date(ts*1000).toLocaleTimeString('ru-RU');
function go(v,x){S.v=v;if(v==='list'){S.cat=x;S.q='';S.mode='all'}if(v==='inst'){S.inst=x;S.sig=null}render();scrollTo(0,0)}
function topbar(){return `<div class="bar">${LN.map((l,i)=>`<button class="pill ${S.lang===i?'on':''}" onclick="S.lang=${i};ls.s('lang',${i});render()">${l.toUpperCase()}</button>`).join('')}<span id="clk"></span><button class="pill" aria-label="refresh" onclick="render()">⟳</button>${S.v!=='home'?`<button class="pill" onclick="go(S.v==='inst'?'list':'home',S.cat)">← ${t('back')}</button>`:''}</div>`}
function render(){document.documentElement.lang=['ru','en','uk'][S.lang];const a=$('#app');a.innerHTML=topbar()+({home,list,inst})[S.v]();if(S.v==='list')items();if(S.v==='inst'){hist();if(S.sig)draw()}else if(S.v==='home')stats();tick()}
function home(){const cnt=c=>INS.filter(i=>i.c===c).length,ic={fx:'FX',cr:'CR',cm:'CM',eq:'EQ'};
 return `<h1>${t('title')}</h1><div class="row">${['LIVE','OTC'].map(m=>`<button class="pill ${S.mode===m?'on':''}" onclick="S.mode=S.mode==='${m}'?'all':'${m}';render()">${m}</button>`).join('')}</div><p class="mu">${t('desc')}</p>`+
 ['fx','cr','cm','eq'].map(c=>`<div class="card cat" onclick="go('list','${c}')"><div class="ico">${ic[c]}</div><div><h2 style="margin:0 0 4px">${t(c)}</h2><div class="mu" style="font-size:14px">${t(c+'d')}</div><div style="margin-top:8px"><span class="tag">${t('n',cnt(c))}</span></div></div><div class="go">→</div></div>`).join('')+`<div class="card"><h2 style="margin:0 0 6px;font-size:18px">${t('stat')}</h2><div id="st" class="mu"></div></div>`}
function stats(){const e=$('#st');if(!e)return;const c=HIS.filter(h=>h.res);if(!c.length){e.textContent=t('nost');return}const ok=c.filter(h=>h.res==='ok').length,bd=c.filter(h=>h.res==='bad').length;e.textContent=t('stx',c.length,c.filter(h=>h.dec==='CALL').length,c.filter(h=>h.dec==='PUT').length,ok,bd,ok+bd?Math.round(ok/(ok+bd)*100)+'%':'—')}
function list(){return `<div class="card"><h2 style="margin:0 0 4px">${t(S.cat)}</h2><div class="mu">${t(S.cat+'d')}</div><div class="row" style="margin:12px 0"><button class="btn" onclick="go('home')">⌂ ${t('home')}</button></div><div class="row"><input id="q" placeholder="${t('srch')}" value="${S.q}" oninput="S.q=this.value;items()" style="flex:1"><button class="btn" onclick="S.q='';S.mode='all';S.sort='az';render()">${t('reset')}</button></div><div class="row" style="margin-top:10px">${['all','LIVE','OTC'].map(m=>`<button class="pill ${S.mode===m||(m==='all'&&S.mode==='all')?'on':''}" onclick="S.mode='${m}';render()">${m==='all'?t('all'):m}</button>`).join('')}</div></div><div id="its"></div>`}
function items(){let l=INS.filter(i=>i.c===S.cat&&i.s.toLowerCase().includes(S.q.toLowerCase())&&(S.mode==='all'||i.m===S.mode.toLowerCase()));l.sort((a,b)=>S.sort==='lim'?left(b)-left(a):a.s.localeCompare(b.s));
 $('#its').innerHTML=l.map(i=>{const k=left(i)>0;return `<div class="card item ${k?'':'off'}" ${k?`onclick="go('inst',INS[${INS.indexOf(i)}])"`:''}><div style="flex:1"><div class="hd" style="font-size:20px;font-weight:800">${nm(i)}</div><div class="mu" style="font-size:13px">${t('st')}: ${k?t('ready'):'—'}</div></div><span class="btn">${t(i.c)}</span></div>`}).join('')||`<p class="mu">—</p>`}
function inst(){const i=S.inst;return `<div class="card"><h2 style="margin:0">${t(i.c)}</h2><div class="mu">${t('instr')}: <b style="color:var(--tx)">${nm(i)}</b></div><div class="row" style="margin:12px 0"><button class="btn" onclick="go('list','${i.c}')">← ${t('tolist')}</button><button class="btn" onclick="go('home')">⌂ ${t('home')}</button></div>
 <div class="mu">${t('price')} <span class="hd" style="font-size:24px;color:var(--tx)" id="px"></span> <span id="ch"></span> <span style="font-size:12px">${t('chg')}</span></div>
 <div class="card" style="margin:12px 0 0"><div class="row" style="justify-content:space-between"><span class="mu hd">${t('sig')}</span><span class="tag">${S.busy?'<i class="sp"></i>':t('ready')}</span></div>
 ${S.sig?res():'<div class="big mu">—</div>'}
 <div class="mu hd" style="margin-top:14px">${t('time')}</div><div class="row" style="margin-top:6px">${[30,60,180,300].map(h=>`<button class="pill ${S.hz===h?'on':''}" onclick="S.hz=${h};S.sig=null;render()">${t('s'+h)}</button>`).join('')}</div>
 ${S.hz===30?`<div class="mu" style="font-size:12px;margin-top:6px">${t('hz30')}</div>`:''}
 <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn main" ${S.busy?'disabled':''} onclick="getSig()">${t('get')}</button><span class="tag">${t('s'+S.hz)}</span></div>
 ${S.sig?`<div class="row" style="margin:14px 0 6px"><button class="btn" onclick="S.zoom=Math.max(30,S.zoom-20);draw()">${t('zin')}</button><button class="btn" onclick="S.zoom=Math.min(120,S.zoom+20);draw()">${t('zout')}</button></div><canvas id="cv"></canvas>`:`<div style="margin-top:14px;padding:30px 16px;text-align:center;border:1px dashed var(--ln);border-radius:18px" class="mu">${t('empty')}</div>`}</div></div>
 <div class="card"><h2 style="margin:0 0 8px;font-size:18px">${t('hist')}</h2><div id="hs" style="overflow-x:auto"></div></div>`}
const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function ai0(r,cs,i){try{const sp=window.claude&&await claude.use('sample');if(!sp)return;const f=x=>+x.toPrecision(6),c=cs.slice(-30).map(k=>f(k.c));
const p=`You are a market analyst reviewing a short-term technical setup (simulated demo data). Instrument ${i.s}, horizon ${S.hz}s, candle ${STEP[S.hz]}s. Last 30 closes: ${JSON.stringify(c)}. EMA9 ${f(r.e9)}, EMA21 ${f(r.e21)}, EMA50 ${f(r.e50)}, RSI ${f(r.rsi)}, MACD histogram ${f(r.mh)}, ATR% ${f(r.atrp*100)}. Rule engine says ${r.dec} (bull ${r.bull}, bear ${r.bear}). Independently decide CALL, PUT or WAIT for the next ${S.hz} seconds; choose WAIT when unclear. Never state a probability of profit. Reply text in ${['Russian','English','Ukrainian'][S.lang]}. Return only JSON: {"verdict":"CALL|PUT|WAIT","confidence":"low|medium|high","summary":"max 2 sentences","risks":"max 1 sentence"}`;
const a=await sp.json(p);if(!['CALL','PUT','WAIT'].includes(a.verdict))a.verdict='WAIT';r.ai=a;if(r.dec!=='WAIT'&&a.verdict!==r.dec){r.dec='WAIT';r.aidis=1}}catch(e){}}
async function ai(r,cs,i){const eng=r.dec;r.str=r.edge>=5?3:r.edge>=3?2:1;try{const sp=window.claude&&await claude.use('sample');if(!sp)return;const f=x=>x==null?null:+x.toPrecision(6),cl=cs.map(k=>k.c),ch=n=>f((cl[cl.length-1]/cl[cl.length-n]-1)*100);
const p=`You are a senior short-term market analyst. Analyze this setup in depth (the data is simulated demo data). Instrument ${i.s}, forecast horizon ${S.hz}s, candle size ${STEP[S.hz]}s.
Last 60 closes: ${JSON.stringify(cl.slice(-60).map(f))}
Last 20 highs: ${JSON.stringify(cs.slice(-20).map(k=>f(k.h)))}
Last 20 lows: ${JSON.stringify(cs.slice(-20).map(k=>f(k.l)))}
Price change % over last 5/15/40/100 candles: ${ch(5)}, ${ch(15)}, ${ch(40)}, ${ch(100)}.
EMA9 ${f(r.e9)}, EMA21 ${f(r.e21)}, EMA50 ${f(r.e50)}, RSI14 ${f(r.rsi)}, MACD histogram ${f(r.mh)}, ATR% ${f(r.atrp*100)}, nearest support ${f(r.sup)}, nearest resistance ${f(r.rs)}.
Rule engine leans ${eng} (bull score ${r.bull}, bear score ${r.bear}).
Consider trend structure on several windows, momentum and its exhaustion, support/resistance, volatility, and whether the engine's lean is consistent with the raw candles. You must choose exactly CALL (price higher after ${S.hz}s) or PUT (lower). Never state a probability of profit. Write text in ${['Russian','English','Ukrainian'][S.lang]}. Return only JSON: {"verdict":"CALL|PUT","confidence":"low|medium|high","factors":["3 to 4 short key factors"],"summary":"max 2 sentences","risks":"max 1 sentence"}`;
const a=await sp.json(p);if(!['CALL','PUT'].includes(a.verdict))return;if(r.done){r.ai=a;r.late=1;if(S.sig===r&&S.v==='inst')render();return}r.ai=a;if(a.verdict===eng){r.str=Math.min(3,r.str+1)}else{r.conflict=1;r.str=1;if(a.confidence==='high'&&r.edge<3)r.dec=a.verdict}}catch(e){}}
function aib(g){if(g.dec==='UNAVAILABLE')return'';const sl=t('strL')+': '+t('str'+(g.str||1))+(g.conflict?' · '+t('conf2'):'');const a=g.ai;if(!a)return `<div class="mu" style="font-size:13px;margin-top:8px">${sl}<br>${t('aiNo')}</div>`;return `<div class="card" style="margin:10px 0;padding:12px"><div class="hd">${t('aiT')}${g.late?' ('+t('aiLate')+')':''}: <span class="${a.verdict}">${a.verdict==='CALL'?'▲':'▼'}</span> <span class="mu" style="font-size:12px">(${t('conf')}: ${esc(a.confidence)})</span></div><div style="margin:4px 0;font-weight:700">${sl}</div><ul>${(Array.isArray(a.factors)?a.factors.slice(0,4):[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div>${esc(a.summary)}</div><div class="mu" style="font-size:13px">${t('risk')}: ${esc(a.risks)}</div><div class="mu" style="font-size:11px;margin-top:4px">${t('aiNote2')}</div></div>`}
function aib0(g){if(g.dec==='UNAVAILABLE')return'';if(!g.ai)return `<div class="mu" style="font-size:13px;margin-top:8px">${t('aiNo')}</div>`;const a=g.ai;return `<div class="card" style="margin:10px 0;padding:12px"><div class="hd">${t('aiT')}: <span class="${a.verdict}">${a.verdict}</span> <span class="mu" style="font-size:12px">(${t('conf')}: ${esc(a.confidence)})</span></div><div>${esc(a.summary)}</div><div class="mu" style="font-size:13px">${t('risk')}: ${esc(a.risks)}</div>${g.aidis?`<div style="color:var(--wa);font-size:13px;margin-top:4px">${t('aiDis')}</div>`:''}<div class="mu" style="font-size:11px;margin-top:4px">${t('aiNote')}</div></div>`}
function res(){const g=S.sig;return `<div class="big ${g.dec}">${t(g.dec).split(' — ')[0]}</div><div>${t(g.dec)}</div>${g.dec!=='UNAVAILABLE'?`<div class="mu" style="font-size:13px;margin-top:6px">${t('sc',g.bull,g.bear)}</div>`:''}${g.dec!=='UNAVAILABLE'?`<div style="font-weight:700;margin-top:6px">${t('strL')}: ${t('str'+(g.str||1))}</div>`:''}<details style="margin-top:8px"><summary class="hd" style="cursor:pointer">${t('fac')}</summary>${aib(g)}<ul>${g.reasons.map(r=>`<li>${t(r[0],r[1])}</li>`).join('')}</ul></details><div class="mu" style="font-size:13px">${tm(g.t)} · ${t('exp',tm(g.exp))} · <span id="cd"></span></div>`}
function getSig(){S.busy=true;S.sig=null;render();setTimeout(()=>{if(S.busy){S.busy=false;S.sig={dec:'UNAVAILABLE',reasons:[['timeout']],done:1};render()}},6000);setTimeout(()=>{let n,i,cs,r;try{n=now();i=S.inst;cs=candles(i,S.hz,n);r=analyze(cs,S.hz,n);r.str=r.edge>=5?3:r.edge>=3?2:1;r.done=1}catch(e){r={dec:'UNAVAILABLE',reasons:[['Error: '+e.message]],done:1}}S.busy=false;S.sig=r;
 if(r.dec==='CALL'||r.dec==='PUT'){try{HIS.unshift({sym:i.s,m:i.m,dec:r.dec,t:n,hz:S.hz,p0:r.price,exp:n+S.hz,p1:null,res:null,bull:r.bull,bear:r.bear});HIS=HIS.slice(0,200);ls.s('his',HIS)}catch(e){}}render();if(r.dec==='CALL'||r.dec==='PUT'){try{ai(r,cs,i).catch(()=>{})}catch(e){}}},300)}
function hist(){const e=$('#hs');if(!e)return;const l=HIS.filter(h=>h.sym===S.inst.s&&h.m===S.inst.m).slice(0,10);e.innerHTML=l.length?`<table><tr><th>${t('time')}</th><th>${t('sig')}</th><th>${t('price')}</th><th>→</th><th></th></tr>${l.map(h=>`<tr><td>${tm(h.t)} (${h.hz}s)</td><td class="${h.dec}">${h.dec}</td><td>${fmt(h.p0)}</td><td>${h.p1?fmt(h.p1):'—'}</td><td>${h.res?t(h.res):t('pend')}</td></tr>`).join('')}</table>`:`<span class="mu">—</span>`}
function draw(){const cv=$('#cv');if(!cv||!S.sig)return;const i=S.inst,cs=candles(i,S.hz).slice(-S.zoom),dpr=devicePixelRatio||1,W=cv.clientWidth,Ht=cv.clientHeight;cv.width=W*dpr;cv.height=Ht*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
 const all=candles(i,S.hz),c=all.map(k=>k.c),E=[[9,'#22d3ee'],[21,'#a78bfa'],[50,'#fbbf24']].map(([p,col])=>[ema(c,p).slice(-S.zoom),col]);
 let hi=Math.max(...cs.map(k=>k.h)),lo=Math.min(...cs.map(k=>k.l));const pd=(hi-lo)*.08||hi*1e-4;hi+=pd;lo-=pd;const Y=p=>Ht-(p-lo)/(hi-lo)*(Ht-16)-8,w=W/cs.length;
 x.strokeStyle='rgba(167,139,250,.12)';for(let g=1;g<5;g++){x.beginPath();x.moveTo(0,g*Ht/5);x.lineTo(W,g*Ht/5);x.stroke()}
 cs.forEach((k,j)=>{const up=k.c>=k.o;x.strokeStyle=x.fillStyle=up?'#34d399':'#fb7185';const cx=j*w+w/2;x.beginPath();x.moveTo(cx,Y(k.h));x.lineTo(cx,Y(k.l));x.stroke();x.fillRect(cx-w*.35,Math.min(Y(k.o),Y(k.c)),w*.7,Math.max(1,Math.abs(Y(k.o)-Y(k.c))))});
 E.forEach(([a,col])=>{x.strokeStyle=col;x.lineWidth=1.4;x.beginPath();a.forEach((v,j)=>j?x.lineTo(j*w+w/2,Y(v)):x.moveTo(w/2,Y(v)));x.stroke()});x.lineWidth=1;
 HIS.filter(h=>h.sym===i.s&&h.m===i.m&&h.hz===S.hz).forEach(h=>{const j=cs.findIndex(k=>h.t>=k.s&&h.t<k.s+STEP[S.hz]);if(j<0)return;x.fillStyle=h.dec==='CALL'?'#34d399':'#fb7185';x.font='bold 12px sans-serif';x.fillText(h.dec==='CALL'?'▲':'▼',j*w,h.dec==='CALL'?Y(cs[j].l)+14:Y(cs[j].h)-4)})}
function tick(){const n=now(),c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString('ru-RU');resolve();
 if(S.v==='inst'){const i=S.inst,p=pr(i,n),p0=pr(i,n-300),e=$('#px');if(e){e.textContent=fmt(p);const d=(p/p0-1)*100,h=$('#ch');h.textContent=(d>=0?'+':'')+d.toFixed(3)+'%';h.style.color=d>=0?'var(--up)':'var(--dn)'}
  const cd=$('#cd');if(cd&&S.sig)cd.textContent=n<S.sig.exp?t('left',S.sig.exp-n):'✓'}}
setInterval(tick,1000);setInterval(()=>{if(S.v==='inst'&&S.sig)draw()},5000);addEventListener('resize',()=>{if(S.v==='inst'&&S.sig)draw()});
